ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 1000
ConcurrentDatabaseReload no
StreamMaxLength 21M
MaxFileSize 20M
MaxScanSize 100M
MaxScanTime 10000
MaxRecursion 10
MaxFiles 1000
AlertExceedsMax yes
SelfCheck 0
OfficialDatabaseOnly yes
