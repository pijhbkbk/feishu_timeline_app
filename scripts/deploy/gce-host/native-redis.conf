bind 0.0.0.0
port 6379
protected-mode yes
daemonize no
logfile ""
loglevel notice
dir /data
save ""
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
aof-load-truncated no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 16mb
maxmemory 64mb
maxmemory-policy noeviction
maxclients 64
timeout 300
tcp-keepalive 60
client-query-buffer-limit 1mb
proto-max-bulk-len 1mb
client-output-buffer-limit normal 4mb 1mb 30
aclfile /run/native-redis.acl
