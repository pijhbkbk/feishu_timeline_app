name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Web
        run: pnpm --filter @feishu-timeline/web build

      - name: Reject Development Build Artifacts
        run: bash scripts/security/check-production-build-artifacts.sh

      - name: Build API
        run: pnpm --filter @feishu-timeline/api build

      - name: Prisma Validate
        run: pnpm --filter @feishu-timeline/api prisma:validate

      - name: Compose Config
        run: docker compose --env-file deploy/env/staging.env.example -f deploy/compose.staging.yml config >/tmp/compose-config.txt

      - name: Compute Canonical Build Identity
        shell: bash
        run: |
          set -euo pipefail

          build_source_commit="$(git rev-parse HEAD)"
          build_source_tree="$(git rev-parse "${build_source_commit}^{tree}")"
          build_release="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          node scripts/deploy/release-identity.mjs validate-identity \
            --source-commit "$build_source_commit" \
            --source-tree "$build_source_tree" \
            --release "$build_release" \
            --build-time "$build_time"

          {
            printf 'BUILD_SOURCE_COMMIT=%s\n' "$build_source_commit"
            printf 'BUILD_SOURCE_TREE=%s\n' "$build_source_tree"
            printf 'BUILD_RELEASE=%s\n' "$build_release"
            printf 'BUILD_TIME=%s\n' "$build_time"
          } >> "$GITHUB_ENV"

      - name: Build API Docker Image
        run: |
          docker build \
            --build-arg BUILD_SOURCE_COMMIT="$BUILD_SOURCE_COMMIT" \
            --build-arg BUILD_SOURCE_TREE="$BUILD_SOURCE_TREE" \
            --build-arg BUILD_RELEASE="$BUILD_RELEASE" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t feishu-timeline-api:ci \
            -f apps/api/Dockerfile \
            .

      - name: Build Web Docker Image
        run: |
          docker build \
            --build-arg BUILD_SOURCE_COMMIT="$BUILD_SOURCE_COMMIT" \
            --build-arg BUILD_SOURCE_TREE="$BUILD_SOURCE_TREE" \
            --build-arg BUILD_RELEASE="$BUILD_RELEASE" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t feishu-timeline-web:ci \
            -f apps/web/Dockerfile \
            .

      - name: Scan Production Container Images
        run: bash scripts/security/scan-production-images.sh feishu-timeline-api:ci feishu-timeline-web:ci

  security-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full History
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Security Gates
        run: bash scripts/security/tests/security-gates.test.sh

      - name: Secrets — Current Tree and Git History
        run: bash scripts/security/run-secrets-scan.sh

      - name: SAST — Authored Candidate Sources Only
        if: always()
        run: bash scripts/security/run-sast.sh

      - name: SCA — Production Dependencies Only
        if: always()
        run: bash scripts/security/run-sca.sh

  playwright-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @feishu-timeline/web exec playwright install --with-deps chromium

      - name: Run Playwright Smoke
        run: pnpm playwright:test
