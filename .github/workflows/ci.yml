name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Prepare Web Release Identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          short_sha="${GITHUB_SHA:0:12}"
          {
            printf 'NODE_ENV=production\n'
            printf 'NEXT_PUBLIC_API_BASE_URL=/api\n'
            printf 'NEXT_PUBLIC_ENABLE_MOCK_LOGIN=false\n'
            printf 'NEXT_PUBLIC_UI_VERSION=v2\n'
            printf 'NEXT_PUBLIC_UI_DATA_MODE=real\n'
            printf 'V1_FALLBACK_ENABLED=false\n'
            printf 'NEXT_PUBLIC_R26_V2_PROTOTYPE=false\n'
            printf 'NEXT_PUBLIC_R26_V2_DATA_MODE=read-only-real\n'
            printf 'RUNTIME_COMMIT=%s\n' "${GITHUB_SHA}"
            printf 'BUILD_TIME=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'RELEASE=ci-%s\n' "${short_sha}"
          } >>"${GITHUB_ENV}"

      - name: Build Web
        run: pnpm --filter @feishu-timeline/web build

      - name: Verify Web Standalone Artifact
        env:
          HOSTNAME: 127.0.0.1
          PORT: 3000
        run: pnpm --filter @feishu-timeline/web standalone:verify

      - name: Reject Development Build Artifacts
        run: bash scripts/security/check-production-build-artifacts.sh

      - name: Build API
        run: pnpm --filter @feishu-timeline/api build

      - name: Prisma Validate
        run: pnpm --filter @feishu-timeline/api prisma:validate

      - name: Compose Config
        run: docker compose --env-file deploy/env/staging.env.example -f deploy/compose.staging.yml config >/tmp/compose-config.txt

      - name: Build API Docker Image
        run: docker build -t feishu-timeline-api:ci -f apps/api/Dockerfile .

      - name: Build Web Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg NEXT_PUBLIC_ENABLE_MOCK_LOGIN="${NEXT_PUBLIC_ENABLE_MOCK_LOGIN}" \
            --build-arg NEXT_PUBLIC_UI_VERSION="${NEXT_PUBLIC_UI_VERSION}" \
            --build-arg NEXT_PUBLIC_UI_DATA_MODE="${NEXT_PUBLIC_UI_DATA_MODE}" \
            --build-arg V1_FALLBACK_ENABLED="${V1_FALLBACK_ENABLED}" \
            --build-arg NEXT_PUBLIC_R26_V2_PROTOTYPE="${NEXT_PUBLIC_R26_V2_PROTOTYPE}" \
            --build-arg NEXT_PUBLIC_R26_V2_DATA_MODE="${NEXT_PUBLIC_R26_V2_DATA_MODE}" \
            --build-arg RUNTIME_COMMIT="${RUNTIME_COMMIT}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            --build-arg RELEASE="${RELEASE}" \
            -t feishu-timeline-web:ci \
            -f apps/web/Dockerfile \
            .

      - name: Scan Production Container Images
        run: bash scripts/security/scan-production-images.sh feishu-timeline-api:ci feishu-timeline-web:ci

  security-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full History
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Security Gates
        run: bash scripts/security/tests/security-gates.test.sh

      - name: Secrets — Current Tree and Git History
        run: bash scripts/security/run-secrets-scan.sh

      - name: SAST — Authored Candidate Sources Only
        if: always()
        run: bash scripts/security/run-sast.sh

      - name: SCA — Production Dependencies Only
        if: always()
        run: bash scripts/security/run-sca.sh

  playwright-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @feishu-timeline/web exec playwright install --with-deps chromium

      - name: Run Playwright Smoke
        run: pnpm playwright:test
