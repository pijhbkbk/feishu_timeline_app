name: ${COMPOSE_PROJECT_NAME:-feishu-timeline-staging}

x-release-metadata: &release-metadata
  RUNTIME_COMMIT: ${RUNTIME_COMMIT:?Set RUNTIME_COMMIT to the full release commit}
  BUILD_TIME: ${BUILD_TIME:?Set BUILD_TIME to the UTC release build timestamp}
  RELEASE: ${RELEASE:?Set RELEASE to the immutable release identifier}

x-web-release: &web-release
  <<: *release-metadata
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL=/api}
  NEXT_PUBLIC_ENABLE_MOCK_LOGIN: ${NEXT_PUBLIC_ENABLE_MOCK_LOGIN:?Set NEXT_PUBLIC_ENABLE_MOCK_LOGIN=false}
  NEXT_PUBLIC_UI_VERSION: ${NEXT_PUBLIC_UI_VERSION:?Set NEXT_PUBLIC_UI_VERSION=v2}
  NEXT_PUBLIC_UI_DATA_MODE: ${NEXT_PUBLIC_UI_DATA_MODE:?Set NEXT_PUBLIC_UI_DATA_MODE=real}
  V1_FALLBACK_ENABLED: ${V1_FALLBACK_ENABLED:?Set V1_FALLBACK_ENABLED=false}
  NEXT_PUBLIC_R26_V2_PROTOTYPE: ${NEXT_PUBLIC_R26_V2_PROTOTYPE:?Set NEXT_PUBLIC_R26_V2_PROTOTYPE=false}
  NEXT_PUBLIC_R26_V2_DATA_MODE: ${NEXT_PUBLIC_R26_V2_DATA_MODE:?Set NEXT_PUBLIC_R26_V2_DATA_MODE=read-only-real}

x-api-runtime: &api-runtime
  <<: *release-metadata
  NODE_ENV: production
  DEPLOYMENT_ENV: staging
  HOST: 0.0.0.0
  PORT: 3001
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the staging environment file}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in the staging environment file}
  NOTIFICATION_QUEUE_ENABLED: ${NOTIFICATION_QUEUE_ENABLED:-true}
  NOTIFICATION_QUEUE_POLL_MS: ${NOTIFICATION_QUEUE_POLL_MS:-5000}
  NOTIFICATION_OVERDUE_SCAN_MS: ${NOTIFICATION_OVERDUE_SCAN_MS:-300000}
  NOTIFICATION_RETRY_DELAY_MS: ${NOTIFICATION_RETRY_DELAY_MS:-5000}
  NOTIFICATION_MAX_RETRIES: ${NOTIFICATION_MAX_RETRIES:-3}
  NOTIFICATION_REDIS_QUEUE_MAX_JOBS: ${NOTIFICATION_REDIS_QUEUE_MAX_JOBS:-2000}
  NOTIFICATION_MEMORY_QUEUE_MAX_JOBS: ${NOTIFICATION_MEMORY_QUEUE_MAX_JOBS:-1000}
  NOTIFICATION_MEMORY_DEDUPE_MAX_KEYS: ${NOTIFICATION_MEMORY_DEDUPE_MAX_KEYS:-5000}
  NOTIFICATION_JOB_MAX_BYTES: ${NOTIFICATION_JOB_MAX_BYTES:-65536}
  NOTIFICATION_SCAN_BATCH_SIZE: ${NOTIFICATION_SCAN_BATCH_SIZE:-100}
  NOTIFICATION_SCAN_MAX_ITEMS: ${NOTIFICATION_SCAN_MAX_ITEMS:-1000}
  SUPPLIER_CATALOG_MAX_ITEMS: ${SUPPLIER_CATALOG_MAX_ITEMS:-5000}
  SUPPLIER_MUTATION_MAX_REQUESTS: ${SUPPLIER_MUTATION_MAX_REQUESTS:-30}
  SUPPLIER_MUTATION_WINDOW_MS: ${SUPPLIER_MUTATION_WINDOW_MS:-3600000}
  AUTH_MOCK_ENABLED: ${AUTH_MOCK_ENABLED:-false}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ft_session}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
  OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-local}
  OBJECT_STORAGE_LOCAL_ROOT: ${OBJECT_STORAGE_LOCAL_ROOT:-/app/var/object-storage}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio.local}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-feishu-timeline-staging}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
  ATTACHMENT_STORAGE_GLOBAL_MAX_BYTES: ${ATTACHMENT_STORAGE_GLOBAL_MAX_BYTES:-5368709120}
  ATTACHMENT_STORAGE_PROJECT_MAX_BYTES: ${ATTACHMENT_STORAGE_PROJECT_MAX_BYTES:-1073741824}
  ATTACHMENT_STORAGE_ACTOR_MAX_BYTES: ${ATTACHMENT_STORAGE_ACTOR_MAX_BYTES:-536870912}
  ATTACHMENT_STORAGE_GLOBAL_MAX_OBJECTS: ${ATTACHMENT_STORAGE_GLOBAL_MAX_OBJECTS:-5000}
  ATTACHMENT_STORAGE_PROJECT_MAX_OBJECTS: ${ATTACHMENT_STORAGE_PROJECT_MAX_OBJECTS:-1000}
  ATTACHMENT_STORAGE_ACTOR_MAX_OBJECTS: ${ATTACHMENT_STORAGE_ACTOR_MAX_OBJECTS:-500}
  ATTACHMENT_STORAGE_MIN_FREE_BYTES: ${ATTACHMENT_STORAGE_MIN_FREE_BYTES:-1073741824}
  ATTACHMENT_STORAGE_RESERVATION_TTL_MS: ${ATTACHMENT_STORAGE_RESERVATION_TTL_MS:-7200000}
  ATTACHMENT_STORAGE_ACTOR_WINDOW_MS: ${ATTACHMENT_STORAGE_ACTOR_WINDOW_MS:-2592000000}
  ATTACHMENT_STORAGE_RECONCILE_INTERVAL_MS: ${ATTACHMENT_STORAGE_RECONCILE_INTERVAL_MS:-300000}
  ATTACHMENT_STORAGE_RECONCILE_BATCH_SIZE: ${ATTACHMENT_STORAGE_RECONCILE_BATCH_SIZE:-100}
  ATTACHMENT_STORAGE_RECONCILIATION_LEASE_MS: ${ATTACHMENT_STORAGE_RECONCILIATION_LEASE_MS:-300000}
  ATTACHMENT_STORAGE_RECONCILIATION_RETRY_MS: ${ATTACHMENT_STORAGE_RECONCILIATION_RETRY_MS:-300000}
  ATTACHMENT_STORAGE_PURGED_METADATA_RETENTION_MS: ${ATTACHMENT_STORAGE_PURGED_METADATA_RETENTION_MS:-7776000000}
  MALWARE_SCANNER_PROVIDER: ${MALWARE_SCANNER_PROVIDER:?Set MALWARE_SCANNER_PROVIDER=clamav in the staging environment file}
  CLAMAV_HOST: ${CLAMAV_HOST:?Set CLAMAV_HOST to the approved scanner endpoint}
  CLAMAV_PORT: ${CLAMAV_PORT:?Set CLAMAV_PORT in the staging environment file}
  CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:?Set CLAMAV_TIMEOUT_MS in the staging environment file}
  UPLOAD_ADMISSION_GLOBAL_LIMIT: ${UPLOAD_ADMISSION_GLOBAL_LIMIT:-4}
  UPLOAD_ADMISSION_PER_ACTOR_LIMIT: ${UPLOAD_ADMISSION_PER_ACTOR_LIMIT:-2}
  UPLOAD_ADMISSION_PER_TARGET_LIMIT: ${UPLOAD_ADMISSION_PER_TARGET_LIMIT:-3}
  UPLOAD_ADMISSION_RATE_MAX_REQUESTS: ${UPLOAD_ADMISSION_RATE_MAX_REQUESTS:-6}
  UPLOAD_ADMISSION_RATE_WINDOW_MS: ${UPLOAD_ADMISSION_RATE_WINDOW_MS:-60000}
  DOWNLOAD_ADMISSION_GLOBAL_LIMIT: ${DOWNLOAD_ADMISSION_GLOBAL_LIMIT:-8}
  DOWNLOAD_ADMISSION_PER_ACTOR_LIMIT: ${DOWNLOAD_ADMISSION_PER_ACTOR_LIMIT:-2}
  DOWNLOAD_ADMISSION_PER_TARGET_LIMIT: ${DOWNLOAD_ADMISSION_PER_TARGET_LIMIT:-2}
  DOWNLOAD_ADMISSION_RATE_MAX_REQUESTS: ${DOWNLOAD_ADMISSION_RATE_MAX_REQUESTS:-12}
  DOWNLOAD_ADMISSION_RATE_WINDOW_MS: ${DOWNLOAD_ADMISSION_RATE_WINDOW_MS:-60000}
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://localhost:8080/login/callback}
  OAUTH_PROVIDER: feishu-cn
  FEISHU_AUTHORIZATION_ENDPOINT: https://accounts.feishu.cn/open-apis/authen/v1/index

services:
  postgres:
    image: ${POSTGRES_IMAGE_REPO:-feishu-timeline-postgres}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/images/postgres/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777}
    container_name: ${COMPOSE_PROJECT_NAME:-feishu-timeline-staging}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feishu_timeline}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the staging environment file}
    ports:
      - 127.0.0.1:${STAGING_POSTGRES_PORT:-15432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-feishu_timeline}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99}
    container_name: ${COMPOSE_PROJECT_NAME:-feishu-timeline-staging}-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the staging environment file}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - 127.0.0.1:${STAGING_REDIS_PORT:-16379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE_REPO:-feishu-timeline-api}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    container_name: ${COMPOSE_PROJECT_NAME:-feishu-timeline-staging}-api
    mem_limit: ${API_MEM_LIMIT:-768m}
    pids_limit: ${API_PIDS_LIMIT:-256}
    environment: *api-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:${STAGING_API_PORT:-3101}:3001
    volumes:
      - object-storage:/app/var/object-storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:3001/api/health',(response)=>process.exit(response.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  api-migrate:
    image: ${API_OPS_IMAGE_REPO:-feishu-timeline-api-ops}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: ops
    profiles: ["ops"]
    mem_limit: ${API_MEM_LIMIT:-768m}
    pids_limit: ${API_PIDS_LIMIT:-256}
    working_dir: /app
    environment: *api-runtime
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - object-storage:/app/var/object-storage
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]

  api-seed:
    image: ${API_OPS_IMAGE_REPO:-feishu-timeline-api-ops}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: ops
    profiles: ["ops"]
    mem_limit: ${API_MEM_LIMIT:-768m}
    pids_limit: ${API_PIDS_LIMIT:-256}
    working_dir: /app
    environment: *api-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - object-storage:/app/var/object-storage
    command: ["/app/node_modules/.bin/tsx", "prisma/seed.ts"]

  web:
    image: ${WEB_IMAGE_REPO:-feishu-timeline-web}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        <<: *web-release
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-轻卡新颜色开发项目管理系统}
    container_name: ${COMPOSE_PROJECT_NAME:-feishu-timeline-staging}-web
    environment:
      <<: *web-release
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-轻卡新颜色开发项目管理系统}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${STAGING_WEB_PORT:-3100}:3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:3000/login',(response)=>process.exit(response.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine@sha256:ec664813a30459a8e7176315268a623f6b31abc370eeac51c7de81cd4ec4d451}
    container_name: ${COMPOSE_PROJECT_NAME:-feishu-timeline-staging}-nginx
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - ${STAGING_HTTP_PORT:-8080}:80
    volumes:
      - ./nginx/compose.staging.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  object-storage:
