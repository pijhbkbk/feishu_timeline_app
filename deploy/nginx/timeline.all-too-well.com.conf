# timeline.all-too-well.com vhost
# HTTP-only template for review. Do not mark this as the default site.
# HTTPS/certbot should be added only after local validation succeeds.

log_format timeline_no_args '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_user_agent"';

map $http_content_type $timeline_review_upload_client {
    default "";
    "~*^multipart/form-data(?:;|$)" $binary_remote_addr;
}
limit_conn_zone $timeline_review_upload_client zone=timeline_review_api_conn:10m;
limit_req_zone $timeline_review_upload_client zone=timeline_review_api_rate:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=timeline_review_download_conn:10m;
limit_req_zone $binary_remote_addr zone=timeline_review_download_rate:10m rate=6r/s;

server {
    listen 80;
    listen [::]:80;
    server_name timeline.all-too-well.com;

    access_log /var/log/nginx/timeline.all-too-well.com.access.log timeline_no_args;
    error_log /var/log/nginx/timeline.all-too-well.com.error.log warn;

    # Leave multipart-envelope room above the API's 20 MiB attachment cap.
    client_max_body_size 21m;
    client_body_timeout 15s;
    error_page 429 = @api_ingress_limited;

    # OAuth code/state are query credentials.  Keep the normal proxy behavior,
    # but never let an upstream failure copy the raw callback request into the
    # Nginx error log.
    location = /login/callback {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~* ^/api/(?:attachments/[A-Za-z0-9_-]+/content|projects/[A-Za-z0-9_-]+/attachments/[A-Za-z0-9_-]+/download|v2/tasks/[A-Za-z0-9_-]+/materials/[A-Za-z0-9_-]+/content)/?$ {
        limit_conn_status 429;
        limit_req_status 429;
        limit_conn timeline_review_download_conn 4;
        limit_req zone=timeline_review_download_rate burst=8 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        send_timeout 30s;
        proxy_ignore_client_abort off;
    }

    location /api/ {
        limit_conn_status 429;
        limit_req_status 429;
        limit_conn timeline_review_api_conn 20;
        limit_req zone=timeline_review_api_rate burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location @api_ingress_limited {
        add_header Retry-After "1" always;
        return 429;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

