map $http_content_type $timeline_staging_upload_client {
    default "";
    "~*^multipart/form-data(?:;|$)" $binary_remote_addr;
}
limit_conn_zone $timeline_staging_upload_client zone=timeline_staging_api_conn:10m;
limit_req_zone $timeline_staging_upload_client zone=timeline_staging_api_rate:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server_tokens off;
    proxy_hide_header X-Powered-By;
    # 21 MiB leaves multipart-envelope room above the API's 20 MiB file cap.
    client_max_body_size 21m;
    client_body_timeout 15s;
    error_page 429 = @api_ingress_limited;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_conn_status 429;
        limit_req_status 429;
        limit_conn timeline_staging_api_conn 20;
        limit_req zone=timeline_staging_api_rate burst=60 nodelay;
        proxy_pass http://api:3001;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location @api_ingress_limited {
        add_header Retry-After "1" always;
        return 429;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
